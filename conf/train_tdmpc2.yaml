defaults:
  - env: pusht
  - paths: paths
  - common
  - encoder: tdmpc2_cnn
  - action_encoder: proprio
  - proprio_encoder: proprio
  - decoder: projected_vqvae_trainable
  - emb_decoder: identity
  - predictor: mlp
  - projector: identity         # TDMPC2: no compression; z = encoder output
  - method: tdmpc2
  - override hydra/launcher: basic
  - _self_

ckpt_base_path: ${paths.data_root}/logs/experiments/tdmpc2/${env_output_name:${env.name},${env.dataset_name}}
resume_folder: none
val_only: false
description: ""

latent_export:
  enabled: false
  output_path: null
  splits: ["train"]
  rgb_key: agentview_image
  latent_grid_size: 14
  mode: trajectory

hydra:
  run:
    dir: ${ckpt_base_path}/${now:%Y-%m-%d}/${now:%H-%M-%S}${maybe_suffix:${description}}
  sweep:
    dir: ${ckpt_base_path}/${now:%Y-%m-%d}/${now:%H-%M-%S}${maybe_suffix:${description}}
    subdir: ${hydra.job.num}

training:
  seed: 0
  epochs: 100
  batch_size: 16
  save_every_x_epoch: 1
  reconstruct_every_x_batch: 500
  num_reconstruct_samples: 2
  encoder_lr: 3e-4       # trainable encoder needs higher lr
  decoder_lr: 3e-4
  predictor_lr: 5e-4
  action_encoder_lr: 5e-4

env:
  dataset_name: walker-stand

has_predictor: true
has_decoder: true

encoder_emb_dim: 256        # TDMPC2 CNN output dim
action_emb_dim: 32

proprio_emb_dim: 64

projected_dim: 256          # identity projector: projected_dim = encoder_emb_dim
compressed_patches: 196
original_patches: 196

alignment_dim: 64

model:
  _target_: models.visual_world_model.VWorldModel
  image_size: ${img_size}
  num_hist: ${num_hist}
  num_pred: ${num_pred}
  train_encoder: true         # TDMPC2: trainable encoder
  alignment_dim: ${alignment_dim}
  train_predictor: true
  train_decoder: true
  train_decoder_grad: true    # decoder gradients flow to encoder
  train_emb_decoder_grad: true
  projected_dim: ${projected_dim}

alignment:
  open_alignment: false
  state_consistency_loss_weight: 0.0
  alignment_regularization: 0.0
  latent_dynamics_loss_weight: 0.0

proprio_pred:
  loss_type: mse
  space: raw
  weight: 0.0
  infonce_temp: 0.1

wandb:
  project: tasuw
  name: "tdmpc2_lift"
  entity: null
