defaults:
  - _self_
  - env: can
  - encoder: dino 
  - action_encoder: proprio
  - proprio_encoder: proprio
  - decoder: vqvae
  - predictor: vit

# Model checkpoint path for alignment model (using existing alignment checkpoint for now)
ckpt_path: ${oc.env:TCWM_DATA_ROOT,./data}/checkpoints  # set to your trained run dir
ckpt_base_path: ${oc.env:TCWM_DATA_ROOT,./data}/checkpoints  # set to your trained run dir

# Dataset
dset_name: "robomimic_can"

# Planning parameters
goal_H: 20
max_time_steps: 200
frameskip: 5
num_trajs_per_goal: 10

# Evaluation 
num_eval_trajs: 10
eval_timeout: 60
eval_seed: 42

# GPU selection
gpu_id: "auto"  # Will auto-select best GPU

# Logging
log_file: "planning_align_recon_H${goal_H}.log"
save_results: true
save_rollouts: false

debug: false